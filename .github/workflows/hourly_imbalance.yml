name: Coinbase BTC hourly imbalance

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-hourly-imbalance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect hourly window
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/collect_hour_window.py \
            --product BTC-USD \
            --depth 10 \
            --minutes 60 \
            --interval-seconds 60 \
            --minute-dir data/minute \
            --hourly-dir data/hourly \
            --state-file state/collector_state.json

      - name: Build homepage payloads
        run: |
          python scripts/build_homepage_payload.py \
            --minute-dir data/minute \
            --hourly-dir data/hourly \
            --latest-json public/data/imbalance_latest.json \
            --hourly-tail-json public/data/imbalance_hourly_tail.json \
            --hourly-tail-count 168

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state public
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update Coinbase imbalance data"

          resolve_conflicts() {
            local unmerged
            unmerged=$(git diff --name-only --diff-filter=U)
            [ -z "$unmerged" ] && return 1

            if echo "$unmerged" | grep -q '^state/collector_state\.json$'; then
              python scripts/resolve_state_conflict.py state/collector_state.json
              git add state/collector_state.json
            fi

            if echo "$unmerged" | grep -qE '^public/data/(imbalance_latest|imbalance_hourly_tail)\.json$'; then
              python scripts/build_homepage_payload.py \
                --minute-dir data/minute \
                --hourly-dir data/hourly \
                --latest-json public/data/imbalance_latest.json \
                --hourly-tail-json public/data/imbalance_hourly_tail.json \
                --hourly-tail-count 168
              git add public/data/imbalance_latest.json public/data/imbalance_hourly_tail.json
            fi

            [ -z "$(git diff --name-only --diff-filter=U)" ]
          }

          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            if resolve_conflicts; then
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort
              exit 1
            fi
          done
          exit 1